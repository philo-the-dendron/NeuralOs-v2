# NeuralOs-v2 workspace
#
# Single member: neuralos-snn. Other crates (neuralos-ml, neuralos-app,
# neuralos-crypto, neuralos-riscv) will be added when they have real code —
# no empty scaffolding (lesson from v0.1).

[workspace]
resolver = "2"
members = ["crates/neuralos-snn", "crates/neuralos-app", "crates/neuralos-rt"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Caramoussin"]
repository = "https://gitea.com/Caramoussin/NeuralOs-v2"
homepage = "https://gitea.com/Caramoussin/NeuralOs-v2"
keywords = ["neural-network", "spiking", "snn", "no_std", "riscv"]
categories = ["science", "embedded", "no-std"]

# Release profile: optimized for size and speed (embedded RISC-V target).
# ThinLTO (not "fat"/true): ~2-3x faster link, near-identical runtime perf —
# matters for the app bin (slint+candle), barely affects the small no_std SNN crate.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

# Dev profile: fast compilation.
[profile.dev]
opt-level = 0
debug = true
