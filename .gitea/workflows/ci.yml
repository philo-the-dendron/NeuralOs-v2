# Gitea Actions mirror of .github/workflows/ci.yml.
#
# WHY BOTH: origin is gitea (git@gitea.com:Caramoussin/NeuralOs-v2.git);
# github is the mirror. The merge-gate protocol (ISA 2026-08-24) keys off
# branch CI, so the authoritative gate belongs where origin lives — a
# GitHub outage or an expired gh token must not be able to block a merge.
# The GitHub workflow stays as a free second opinion.
#
# DIFFERENCES from the GitHub file, and only these:
#   1. `uses:` takes full URLs — Gitea does not resolve the bare
#      `actions/...` namespace (same form as .gitea/workflows in cipherpulse).
#   2. Nothing else. Jobs, steps, triggers, and timeouts are identical, so
#      the two files can be diffed line-for-line when either changes.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check + test + clippy + no_std
    runs-on: ubuntu-latest
    # Hard ceiling: the battery is ~15 min warm; 90 min absorbs a cold
    # cache + Slint system-dep install without a hung job burning runners.
    timeout-minutes: 90
    steps:
      - uses: https://github.com/actions/checkout@v4

      # rust-toolchain.toml pins 1.92.0 (slint MSRV); rustup honors it.
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cargo.lock is committed (deterministic deps; hdf5-sys vendored-C
      # pin) — the cache key is stable across runs.
      - uses: https://github.com/Swatinem/rust-cache@v2

      # Slint's femtovg/winit backends link against these on Linux.
      - name: Slint Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev

      # Formatting is a gate, not a suggestion: the tree was 48 files red
      # for weeks with nothing looking. Added 2026-09-02 with the sweep.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      # Default features only — fully offline. The workspace test suite is the
      # neuralos-snn property tests + the neuralos-app SimRunner tests; no network.
      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The SNN core stays no_std (the embedded/RISC-V posture).
      - name: no_std gate (neuralos-snn)
        run: cargo build --no-default-features -p neuralos-snn

      # SIMD kernel equivalence vs scalar (AVX2, x86_64, behind `simd`).
      # NEURALOS_REQUIRE_AVX2 turns the module's nine "AVX2 not available"
      # skips into one failure (`ci_runner_actually_has_avx2`), so a runner
      # without AVX2 cannot pass this gate by not running it. Added 2026-09-02.
      - name: simd gate (neuralos-snn)
        env:
          NEURALOS_REQUIRE_AVX2: "1"
        run: cargo test -p neuralos-snn --features simd

      # Workspace clippy never compiles the feature-gated simd module; lint it
      # under its own feature (same pattern as the hdf5 leg). Added 2026-08-30.
      - name: simd lint gate (neuralos-snn)
        run: cargo clippy -p neuralos-snn --features simd --all-targets -- -D warnings

      # The slice-length contract is assert_eq!; its regression test is only
      # distinguishable from debug_assert_eq! in release. Added 2026-08-30.
      - name: simd release gate (neuralos-snn)
        env:
          NEURALOS_REQUIRE_AVX2: "1"
        run: cargo test -p neuralos-snn --release --features simd -- --include-ignored

  # The HDF5 feature leg (NIR slice 2): vendored HDF5 (needs cmake) +
  # the reference-fixture tests + THE EVIDENCE GATE + feature clippy.
  # The ~3 min vendored-C build lands in target/ and is cached by
  # rust-cache, so it repeats only when Cargo.lock moves.
  hdf5:
    name: hdf5 gate (neuralos-rt)
    runs-on: ubuntu-latest
    # Vendored HDF5 cold build (~3 min) + full rt suite + the evidence
    # gate + feature clippy; 120 min covers the no-rust-cache worst case.
    timeout-minutes: 120
    steps:
      - uses: https://github.com/actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cmake (vendored HDF5 build)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: cargo test -p neuralos-rt --features hdf5
        run: cargo test -p neuralos-rt --features hdf5

      - name: nir_hdf5_gate (the evidence gate)
        run: cargo run -p neuralos-rt --features hdf5 --example nir_hdf5_gate

      - name: clippy with the feature
        run: cargo clippy -p neuralos-rt --features hdf5 --all-targets -- -D warnings

  # Every commit on the branch is green on its own (AGENTS.md § Session
  # protocol, ratified 2026-08-30). The check job above only ever tests
  # the pushed tip; this job loops over the commits a pull request adds
  # and runs the § Commands gate set at each one, so a red intermediate
  # commit is a red check, not a merger's memory. Added 2026-09-02 after
  # the rule was broken by hand once and then caught two real defects the
  # same day when run as a loop. pull_request only: a push still gets
  # the tip-only jobs above, and workflow_dispatch skips this job too.
  # The commit set is base..head: the commits reachable from head and
  # not from the base sha the PR event carries. With a current base that
  # is exactly the PR's own commits; with a stale base it can also hold
  # commits main gained since, never fewer than the PR's own. The fmt
  # check is judged per the gate set at each commit: it runs when either
  # workflow file at that commit carries the fmt step, so mirror drift
  # surfaces as fmt running, never as fmt silently skipped. The loop body
  # IS AGENTS.md § Commands, kept in sync by hand; a divergence is drift.
  # Green here is incremental-green: commits are checked out in place on
  # one restored cargo cache, the same way the tip-only jobs and the
  # repo's former `git rebase -x` loop built. Cargo fingerprints sources
  # by content and mtime, and checkout touches what changed, so a stale
  # artifact does not satisfy a changed source; the cold scratch-worktree
  # loop in AGENTS.md stays the clean-build proof. The runner is a single
  # self-hosted box (cp-desktop) that runs one job at a time, so a PR's
  # wall time is check + hdf5 + this, in sequence, not in parallel.
  # This job gates a merge only once branch protection on main names it
  # as a required status; adding the job does not do that by itself.
  per-commit:
    name: every commit green on its own
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One full gate set per commit. Measured on cp-desktop 2026-09-02:
    # two commits cold in 20 min (PR #5); with the cache warm, two green
    # commits plus the start of a red third in 8.5 min (PR #6). So about
    # 10 min cold and about 4 min per further commit; 240 min budgets a
    # branch of roughly fifty commits, and a longer one times out here.
    timeout-minutes: 240
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: Slint Linux build deps + cmake (vendored HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            libfreetype6-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev

      - name: gate set at every commit base..head
        env:
          NEURALOS_REQUIRE_AVX2: "1"
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # fetch-depth 0 already holds both for a same-repo PR; this is a
          # no-op belt for that case and non-fatal so rev-list reports instead.
          git fetch --no-tags --quiet origin "$base" "$head" || true
          commits=$(git rev-list --reverse "$base".."$head")
          n=$(printf '%s\n' "$commits" | grep -c . || true)
          echo "== $n commit(s) in $base..$head"
          test "$n" -gt 0
          for c in $commits; do
            git checkout --quiet "$c"
            echo "===== $c $(git log -1 --format=%s)"
            if grep -qE '^ +- name: cargo fmt --check$' .gitea/workflows/ci.yml .github/workflows/ci.yml; then
              cargo fmt --all -- --check
            else
              echo "(fmt --check is not a gate at this commit)"
            fi
            cargo check --workspace --all-targets
            cargo test --workspace
            cargo clippy --workspace --all-targets -- -D warnings
            cargo build --no-default-features -p neuralos-snn
            cargo test -p neuralos-snn --features simd
            cargo clippy -p neuralos-snn --features simd --all-targets -- -D warnings
            cargo test -p neuralos-snn --release --features simd -- --include-ignored
            cargo test -p neuralos-rt --features hdf5
            cargo run -p neuralos-rt --features hdf5 --example nir_hdf5_gate
            cargo clippy -p neuralos-rt --features hdf5 --all-targets -- -D warnings
            echo "===== $c GREEN"
          done
          echo "== all $n commit(s) green on their own"
