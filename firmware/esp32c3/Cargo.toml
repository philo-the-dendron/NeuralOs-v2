[package]
name = "neuralos-esp32c3"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "One LIF neuron from neuralos-snn on an ESP32-C3: delay-paced step, LED and serial on each spike"

# Own workspace on purpose (same pattern as proofs/): esp-hal compiles only
# for the chip target, so a root workspace member would break the host-side
# `cargo check --workspace` in CI.
[workspace]

[dependencies]
neuralos-snn = { path = "../../crates/neuralos-snn", default-features = false }
esp-hal = { version = "~1.1", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.16", features = ["esp32c3"] }
# The ESP-IDF app descriptor. The bootloader espflash bundles (ESP-IDF 5.5)
# reads it and refuses the partition without one ("Factory app partition is
# not bootable", observed on the SuperMini 2026-09-09); espflash 4 refuses
# to flash such an image. 0.5.0 is the esp-hal 1.1 pair; 0.6.0 needs Rust
# 1.95, the same wall as esp-hal 1.2.
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
