[package]
# The inbound bridge: a stranger's NIR `.nir` (HDF5) → the snn JSON
# schema. Leaf tool per the M1 step-4 amendment (2026-08-23).
name = "neuralos-nir2json"
# Own version — deliberately NOT workspace-inherited (FIX-6): the tool
# versions independently of the library.
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Convert Neuromorphic Intermediate Representation (.nir, HDF5) files into the neuralos-snn JSON import schema — pure Rust, no C toolchain"
license = "AGPL-3.0-or-later"
# crates.io publish DEFERRED until after the step-7 demand measurement
# (the one-way-door ruling, ISA 2026-08-23). Distribution: prebuilt
# release binaries + `cargo install --git`.
publish = false

[[bin]]
name = "neuralos-nir2json"
path = "src/main.rs"

[dependencies]
# Default features OFF: the dependency contract is "byteorder +
# miniz_oxide (via flate2's rust backend), no C anywhere" — the
# registry-verified reduction. `std` for the file reader, `deflate`
# for gzip'd NIR datasets; checksum (crc32fast) and the ndarray/serde
# opt-ins stay out.
hdf5-pure = { version = "0.39.0", default-features = false, features = ["std", "deflate"] }
# REGISTRY-VS-PATH (the amendment's manifest comment): `version` +
# `path` — inside the workspace, and for `cargo install --git`
# strangers (who receive the whole repo), the PATH resolves and the
# tool builds against the tree it ships with. A FUTURE crates.io
# publish of this tool would resolve the version requirement against
# the registry instead — post-alpha spine API breaks then require a
# spine republish before the tool's next semver-honest release.
neuralos-snn = { version = "0.1.0-alpha.5", path = "../neuralos-snn" }

[dev-dependencies]
# Tests only — never shipped: value-level comparison of converted
# documents (the f32-twin oracle) and structural assertions.
serde_json = "1"
