[package]
name = "neuralos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "NeuralOS research-summarization desktop app — Slint UI, candle/Flan-T5 summarize, arXiv/PubMed fetch"

# App-specific metadata (do NOT inherit the SNN crate's no_std/riscv keywords).
keywords = ["summarization", "arxiv", "research", "slint", "local-ai"]
categories = ["science", "gui"]

[lib]
name = "neuralos_app"
path = "src/lib.rs"

[[bin]]
name = "neuralos-app"
path = "src/main.rs"

[features]
# `qwen` gates the candle-backed local summarizer (heavy deps). Default off so
# the core lib (fetch + Summarize trait + mock) + Slint UI stay light and fast.
default = []
qwen = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:anyhow",
]

[dependencies]
# ureq: blocking HTTP over rustls. Minimal audit surface (cipherpunk stance).
# Fetch runs on a worker thread, never the UI loop.
ureq = { version = "2", default-features = false, features = ["tls"] }
# quick-xml: streaming Atom XML reader, no unsafe, tiny. Never a DOM lib.
quick-xml = "0.36"
# slint: pure-Rust UI toolkit (GPLv3 option, AGPL-compatible). No webview black box.
slint = "1.17"
# Local summarizer backend (optional; enabled by `--features qwen`).
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# Model weights are fetched from the HF Hub via plain ureq (the app already
# depends on it). hf-hub 0.3's metadata() chokes on HF's relative redirect
# Location, so we build the resolve URLs ourselves and let ureq follow redirects.
# Pure-rust regex backend (no onig/esaxx C deps).
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
anyhow = { version = "1", optional = true }

[build-dependencies]
slint-build = "1.17"

[[example]]
name = "summarize_smoke"
required-features = ["qwen"]
