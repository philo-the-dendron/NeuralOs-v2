[package]
name = "neuralos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "NeuralOS SNN visualizer — a live microscope onto the spiking neural network"

# App-specific metadata.
keywords = ["spiking-neural-network", "visualization", "slint", "local"]
categories = ["science", "gui"]

[lib]
name = "neuralos_app"
path = "src/lib.rs"

[[bin]]
name = "neuralos-app"
path = "src/main.rs"

[dependencies]
# The keystone: neuralos-app is now a visualizer ON TOP of the SNN library.
# This single dependency is what makes "the library connects all" literally true.
neuralos-snn = { path = "../neuralos-snn", features = ["std"] }
# slint: pure-Rust UI toolkit (GPLv3 option, AGPL-compatible). No webview.
slint = "1.17"

[build-dependencies]
slint-build = "1.17"
