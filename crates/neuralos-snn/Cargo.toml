[package]
name = "neuralos-snn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Spiking Neural Network library, no_std, i16 fixed-point — NeuralOS sovereignty stack core"
readme = "README.md"

[lib]
name = "neuralos_snn"

[features]
default = ["std"]
std = []
# SIMD-accelerated batch LIF integration (AVX2, x86_64 only). Implies `std`
# because runtime feature detection (`is_x86_feature_detected!`) is std-only.
# A future `no_std` variant could select backends at compile time via
# `#[cfg(target_feature)]` for embedded RISC-V.
simd = ["std"]
# STDP, outside the semver promise: `STDPRule`, `Synapse::update_weight`,
# `SpikingNeuralNetwork::set_plasticity_enabled`,
# `stochastic_ternary_step`, `trit::stochastic_ternary_flip` and
# `trit::STOCHASTIC_FLIP_RATE`. Anything behind it may change or go in a
# minor release. Off by default: a default build does not learn.
unstable-stdp = []

# docs.rs builds the default features alone; the gated items' docs exist
# only with the feature on.
[package.metadata.docs.rs]
features = ["unstable-stdp"]

[dependencies]
# None. The spike history is a [u32; N] ring, SpikeRecorder in
# spike_recorder.rs (alpha.8; a field of the neuron in lif_neuron.rs
# from 2026-09-10, alpha.6); heapless, the one runtime dependency
# before that, is now the differential oracle below. Audit surface: core.

[dev-dependencies]
# Property-based tests — Cardano-grade rigor (leçon v0.1: tout test doit être réel)
proptest = "1.5"
# The pre-ring spike history, kept as the oracle of the differential
# test in spike_recorder.rs (prop_ring_matches_the_heapless_oracle).
heapless = "0.8"

[[example]]
name = "bench_simd"
required-features = ["simd"]

# The five examples that learn, or that write the plasticity-on trace:
# `-p neuralos-snn` skips them in silence, as it does `bench_simd`; the
# workspace build turns the feature on (rt and the app ask for it) and
# covers them.
[[example]]
name = "demo"
required-features = ["unstable-stdp"]

[[example]]
name = "ternary_gate"
required-features = ["unstable-stdp"]

[[example]]
name = "ternary_selectivity"
required-features = ["unstable-stdp"]

[[example]]
name = "ternary_hybrid_gate"
required-features = ["unstable-stdp"]

[[example]]
name = "trace"
required-features = ["unstable-stdp"]
