[package]
name = "neuralos-snn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Spiking Neural Network library, no_std, i16 fixed-point — NeuralOS sovereignty stack core"
readme = "README.md"

[lib]
name = "neuralos_snn"

[features]
default = ["std"]
std = []

[dependencies]
# heapless: compile-time-capacity Vec for spike history. no_std + alloc-free.
# This is the ONLY runtime dep — keeps the audit surface minimal.
heapless = "0.8"

[dev-dependencies]
# Property-based tests — Cardano-grade rigor (leçon v0.1: tout test doit être réel)
proptest = "1.5"
