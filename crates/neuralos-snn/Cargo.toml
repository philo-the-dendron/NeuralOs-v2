[package]
name = "neuralos-snn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Spiking Neural Network library, no_std, i16 fixed-point — NeuralOS sovereignty stack core"
readme = "README.md"

[lib]
name = "neuralos_snn"

[features]
default = ["std"]
std = []
# SIMD-accelerated batch LIF integration (AVX2, x86_64 only). Implies `std`
# because runtime feature detection (`is_x86_feature_detected!`) is std-only.
# A future `no_std` variant could select backends at compile time via
# `#[cfg(target_feature)]` for embedded RISC-V.
simd = ["std"]

[dependencies]
# None. The spike history is a [u32; N] ring in lif_neuron.rs since
# 2026-09-10 (alpha.6); heapless, the one runtime dependency before
# that, is now the differential oracle below. Audit surface: core.

[dev-dependencies]
# Property-based tests — Cardano-grade rigor (leçon v0.1: tout test doit être réel)
proptest = "1.5"
# The pre-ring spike history, kept as the oracle of the differential
# test in lif_neuron.rs (prop_ring_matches_the_heapless_oracle).
heapless = "0.8"

[[example]]
name = "bench_simd"
required-features = ["simd"]
